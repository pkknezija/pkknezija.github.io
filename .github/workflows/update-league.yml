name: Osvjezi HPS ligu
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dohvati HPS podatke
        run: node scripts/update-league.cjs
      - name: Spremi promjene samo kad se rezultati promijene
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add league.json
          if ! git diff --cached --quiet; then
            git commit -m 'Automatsko osvjezavanje lige (HPS)'
            git push
          else
            echo 'Nema novih rezultata.'
          fi
